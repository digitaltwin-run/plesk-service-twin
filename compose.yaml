name: plesk-service-twin

services:
  nginx:
    image: nginx:alpine
    container_name: plesk-twin-nginx
    ports:
      - "127.0.0.1:8791:80"
      - "[::1]:8791:80"
    volumes:
      - ./httpdocs:/var/www/vhosts/subactor.com/httpdocs:ro
      - ./nginx/plesk-vhost.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    restart: unless-stopped

  php-fpm:
    image: php:8.3-fpm-alpine
    container_name: plesk-twin-fpm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      # Production SMTP from platform/.env — real email delivery, no Mailpit.
      SMTP_HOST: prototypowanie.pl
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: ${SMTP_USER:-info@prototypowanie.pl}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: info@prototypowanie.pl
      SMTP_FROM_NAME: "Subactor"
    networks:
      - default
      - platform
    volumes:
      - ./httpdocs:/var/www/vhosts/subactor.com/httpdocs:rw
    restart: unless-stopped

  plesk-admin-mock:
    image: node:20-alpine
    container_name: plesk-twin-admin-mock
    working_dir: /app
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - ./admin-mock:/app
    command: node server.mjs
    environment:
      - PORT=8792
      - PLESK_MOCK_MODE=true
      - PLESK_VERSION=18.0.60
    restart: unless-stopped

networks:
  platform:
    external: true
    name: subactor-platform-net
