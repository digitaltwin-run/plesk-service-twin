server {
    listen 80;
    server_name subactor.com www.subactor.com localhost 127.0.0.1 ::1;

    root /var/www/vhosts/subactor.com/httpdocs;
    index index.html index.htm index.php;

    # Plesk security headers
    add_header X-Powered-By "PleskLin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Inspection header for Digital Twin verification
    add_header X-Plesk-Digital-Twin "active" always;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ACME and other explicitly public discovery documents are the only
    # dot-prefixed paths that may be served.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Defence in depth: publishing already excludes private source material,
    # but the web server must fail closed if a bad artifact reaches httpdocs.
    location ~ (^|/)\. {
        return 404;
    }

    location ~* ^/(?:Dockerfile|Makefile|README(?:\.[^/]*)?|CHANGELOG(?:\.[^/]*)?|TODO(?:\.[^/]*)?|compose\.ya?ml|docker-compose\.ya?ml|project\.manifest\.json|package(?:-lock)?\.json)$ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

}
