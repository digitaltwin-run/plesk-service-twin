<!DOCTYPE html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subactor — platforma autonomizacji procesów biznesowych</title>
    <meta name="description" content="Subactor autonomizuje procesy biznesowe: ograniczona autonomia diagnozuje i planuje, następnie generuje automatyzacje oraz waliduje ich wyniki przez integracje ERP, Allegro i LLM." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-display: 'Outfit', ui-sans-serif, system-ui, sans-serif;
        --bg-primary: #0F172A;
        --bg-surface: rgba(30, 41, 59, 0.94);
        --bg-card: #1E293B;
        --bg-elevated: #1E293B;
        --border-color: #475569;
        --border-strong: #64748B;
        --text-primary: #FFFFFF;
        --text-secondary: #D1D9E6;
        --text-muted: #AEBBCD;
        --accent-primary: #A5B4FC;
        --accent-hover: #C7D2FE;
        --accent-gradient: linear-gradient(135deg, #4F46E5 0%, #7E22CE 100%);
        --success-color: #6EE7B7;
        --success-text: #6EE7B7;
        --success-soft: rgba(16, 185, 129, 0.15);
        --info-color: #93C5FD;
        --info-text: #93C5FD;
        --warn-color: #FCD34D;
        --danger-color: #FCA5A5;
        --danger-text: #FCA5A5;
        --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.22);
        --shadow-card: 0 18px 40px -24px rgba(0, 0, 0, 0.75);
        --card-radius: 16px;
      }

      [data-theme='light'] {
        --bg-primary: #F8FAFC;
        --bg-surface: rgba(255, 255, 255, 0.85);
        --bg-card: #FFFFFF;
        --bg-elevated: #FFFFFF;
        --border-color: #CBD5E1;
        --border-strong: #94A3B8;
        --text-primary: #0F172A;
        --text-secondary: #334155;
        --text-muted: #475569;
        --accent-primary: #4338CA;
        --accent-hover: #3730A3;
        --success-color: #047857;
        --success-text: #047857;
        --info-color: #1D4ED8;
        --info-text: #1D4ED8;
        --warn-color: #92400E;
        --danger-color: #B91C1C;
        --danger-text: #B91C1C;
        --shadow-glow: 0 10px 30px rgba(99, 102, 241, 0.14);
        --shadow-card: 0 18px 40px -28px rgba(15, 23, 42, 0.4);
      }

      *,
      *::before,
      *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { scroll-behavior: smooth; font-size: 17px; }

      body {
        font-family: var(--font-family);
        font-size: 1rem;
        font-weight: 450;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.65;
        min-height: 100vh;
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; }

      .brand,
      .hero h1,
      .card-title,
      .price-val,
      .section-title,
      .auth-title,
      .integration-name,
      .panel-card-title,
      .panel-section-title,
      .dashboard-header h2,
      .metric-value,
      .lock-title { font-family: var(--font-display); }

      :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
        outline: 3px solid var(--accent-primary);
        outline-offset: 3px;
      }

      /* --- Icons: every glyph on this page is an inline SVG --- */
      .icon { width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.125em; }
      .icon-lg { width: 1.4em; height: 1.4em; }
      .icon-xl { width: 3rem; height: 3rem; }

      .container { max-width: 1180px; margin: 0 auto; padding: 0 1.5rem; }
      .container-workspace { max-width: 1480px; }

      /* --- Navbar --- */
      .navbar {
        display: flex; justify-content: space-between; align-items: center;
        gap: 1rem; padding: 1.1rem 0;
        border-bottom: 1px solid var(--border-color);
        position: sticky; top: 0; z-index: 100;
        background: color-mix(in srgb, var(--bg-primary) 88%, transparent);
        backdrop-filter: blur(12px);
      }
      .brand {
        display: flex; align-items: center; gap: 0.55rem;
        font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em;
      }
      .brand-mark { color: var(--accent-primary); display: flex; }
      .brand-text {
        background: var(--accent-gradient);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nav-controls { display: flex; align-items: center; gap: 0.6rem; }
      .global-item-view-select { max-width: 12rem; }
      .btn-toggle {
        display: inline-flex; align-items: center; gap: 0.4rem;
        background: var(--bg-surface); border: 1px solid var(--border-color);
        color: var(--text-primary); padding: 0.5rem 0.85rem; border-radius: 9px;
        cursor: pointer; font-size: 0.95rem; font-weight: 600;
        font-family: inherit; transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .btn-toggle:hover { border-color: var(--accent-primary); transform: translateY(-1px); }

      /* --- Buttons --- */
      .btn-primary {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        background: var(--accent-gradient); color: #fff; border: none;
        padding: 0.8rem 1.4rem; border-radius: 11px; font-weight: 600; font-size: 1rem;
        font-family: inherit; cursor: pointer; width: 100%;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); }
      .btn-primary:disabled { opacity: 0.6; cursor: wait; transform: none; box-shadow: none; }
      .btn-secondary {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        background: transparent; color: var(--text-primary);
        border: 1px solid var(--border-strong); padding: 0.8rem 1.4rem;
        border-radius: 11px; font-weight: 600; font-size: 1rem;
        font-family: inherit; cursor: pointer; width: 100%;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .btn-secondary:hover { border-color: var(--accent-primary); transform: translateY(-2px); }

      /* --- Badges / notices --- */
      .badge {
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.85rem 1.2rem; border-radius: 11px; margin: 1.5rem 0;
        font-size: 1rem; font-weight: 600; animation: fadeIn 0.4s ease-out;
      }
      .badge-success { background: var(--success-soft); border: 1px solid var(--success-color); color: var(--success-text); }
      .badge-info { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--info-color); color: var(--info-text); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

      /* --- Hero --- */
      .hero { text-align: center; padding: 3.5rem 0 1.5rem; }
      .hero-eyebrow,
      .section-eyebrow {
        display: block; margin-bottom: 0.55rem;
        color: var(--accent-primary); font-size: 0.875rem; font-weight: 750;
        letter-spacing: 0.09em; text-transform: uppercase;
      }
      .hero h1 {
        font-size: clamp(2rem, 4.4vw, 3rem); font-weight: 800;
        letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 0.9rem;
      }
      .hero-sub {
        font-size: 1.1rem; color: var(--text-secondary);
        max-width: 640px; margin: 0 auto 1.5rem;
      }
      .hero-cta {
        width: auto; margin: 0 auto; padding-inline: 1.5rem;
        text-decoration: none;
      }
      .audience-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }
      .chip {
        display: inline-flex; align-items: center; gap: 0.4rem;
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: 999px; padding: 0.35rem 0.9rem;
        font-size: 0.95rem; font-weight: 600; color: var(--text-secondary);
      }
      .chip .icon { color: var(--success-color); }
      .audience-link {
        text-decoration: none;
        transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      }
      .audience-link:hover {
        color: var(--text-primary); border-color: var(--accent-primary);
        background: rgba(99, 102, 241, 0.12); transform: translateY(-1px);
      }
      .offer-anchor { scroll-margin-top: 6.5rem; }

      /* --- Plain-language use cases --- */
      .use-cases-section { margin-top: 2rem; }
      .use-cases-head { max-width: 720px; }
      .use-cases-grid {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem; align-items: stretch;
      }
      .use-case-card {
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: var(--card-radius); padding: 1.35rem;
        display: flex; flex-direction: column; gap: 1rem;
        box-shadow: var(--shadow-card);
      }
      .use-case-heading { display: flex; align-items: flex-start; gap: 0.8rem; }
      .use-case-icon {
        width: 2.65rem; height: 2.65rem; flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        border-radius: 11px; color: var(--accent-primary);
        background: rgba(99, 102, 241, 0.14);
      }
      .use-case-heading h3 {
        font-family: var(--font-display); font-size: 1.12rem;
        line-height: 1.3; margin-bottom: 0.3rem;
      }
      .use-case-heading p { color: var(--text-secondary); font-size: 0.95rem; }
      .use-case-flow {
        list-style: none; display: flex; flex-direction: column;
        gap: 0.75rem; counter-reset: use-case-step;
      }
      .use-case-flow li {
        position: relative; display: grid; gap: 0.2rem;
        padding-left: 1.9rem; color: var(--text-secondary); font-size: 0.92rem;
        counter-increment: use-case-step;
      }
      .use-case-flow li::before {
        content: counter(use-case-step); position: absolute; left: 0; top: 0.05rem;
        width: 1.35rem; height: 1.35rem; border-radius: 999px;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg-surface); border: 1px solid var(--border-strong);
        color: var(--text-primary); font-size: 0.875rem; font-weight: 750;
      }
      .use-case-step-label {
        color: var(--text-primary); font-size: 0.875rem; font-weight: 750;
        letter-spacing: 0.05em; text-transform: uppercase;
      }
      .use-case-boundary {
        display: flex; align-items: flex-start; gap: 0.5rem;
        margin-top: auto; padding-top: 0.9rem; border-top: 1px solid var(--border-color);
        color: var(--text-secondary); font-size: 0.9rem;
      }
      .use-case-boundary .icon { color: var(--success-color); margin-top: 0.25rem; }
      .provider-guide {
        margin-top: 2rem; padding: 1.5rem;
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--card-radius);
      }
      .provider-guide-head { max-width: 720px; margin: 0 auto 1.25rem; text-align: center; }
      .provider-guide-head h3 {
        font-family: var(--font-display); font-size: 1.35rem;
        line-height: 1.3; margin-bottom: 0.4rem;
      }
      .provider-guide-head p { color: var(--text-secondary); }
      .provider-grid {
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }
      .provider-card {
        min-width: 0; display: flex; align-items: flex-start; gap: 0.75rem;
        padding: 1rem; background: var(--bg-card);
        border: 1px solid var(--border-color); border-radius: 11px;
      }
      .provider-icon {
        width: 2.25rem; height: 2.25rem; flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        border-radius: 9px; background: rgba(99, 102, 241, 0.14);
        color: var(--accent-primary);
      }
      .provider-content { min-width: 0; display: grid; gap: 0.25rem; }
      .provider-content h4 { font-size: 1rem; line-height: 1.3; }
      .provider-content p { color: var(--text-secondary); font-size: 0.92rem; }
      .provider-access {
        width: fit-content; max-width: 100%; margin-top: 0.15rem;
        padding: 0.18rem 0.55rem; border-radius: 999px;
        background: var(--success-soft); border: 1px solid var(--success-color);
        color: var(--success-text); font-size: 0.875rem; font-weight: 700;
        overflow-wrap: anywhere;
      }
      .provider-boundary,
      .provider-clarification {
        display: flex; align-items: flex-start; gap: 0.55rem;
        margin-top: 1rem; color: var(--text-secondary); font-size: 0.92rem;
      }
      .provider-boundary .icon { color: var(--success-color); margin-top: 0.25rem; }
      .provider-clarification .icon { color: var(--info-color); margin-top: 0.25rem; }
      .use-cases-cta {
        max-width: 580px; margin: 1.5rem auto 0; text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
      }
      .use-cases-cta .btn-primary { width: auto; text-decoration: none; }
      .use-cases-cta p { color: var(--text-muted); font-size: 0.9rem; }

      /* --- Billing toggle --- */
      .billing-toggle-container {
        display: inline-flex; gap: 0.35rem; padding: 0.35rem;
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: 13px; margin-bottom: 0.75rem;
      }
      .billing-btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        background: transparent; border: none; color: var(--text-secondary);
        padding: 0.6rem 1.15rem; border-radius: 10px; cursor: pointer;
        font-family: inherit; font-size: 0.95rem; font-weight: 600;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .billing-btn.active { background: var(--accent-gradient); color: #fff; }
      .discount-pill {
        background: var(--success-soft); color: var(--success-text); border: 1px solid var(--success-color);
        border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.875rem; font-weight: 700;
        letter-spacing: 0.02em;
      }
      .billing-btn.active .discount-pill { background: rgba(255, 255, 255, 0.18); color: #fff; border-color: transparent; }
      .billing-hint { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2.25rem; }
      .offer-section { text-align: center; }
      .offer-display-options {
        max-width: 100%; margin: 0 auto 1.25rem; text-align: left;
        border: 1px solid var(--border-color); border-radius: 11px;
        background: var(--bg-surface);
      }
      .offer-display-options > summary {
        cursor: pointer; padding: 0.7rem 0.9rem;
        color: var(--text-secondary); font-size: 0.9rem; font-weight: 650;
      }
      .offer-display-options[open] > summary { border-bottom: 1px solid var(--border-color); }
      .offer-display-options .offer-view-toolbar { padding: 0.8rem 0.9rem; }
      .offer-display-options .billing-hint { margin-bottom: 0; }

      /* --- Pricing grid --- */
      .pricing-grid {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 1.35rem; align-items: stretch; text-align: left;
      }
      .card {
        position: relative; display: flex; flex-direction: column; gap: 1rem;
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: var(--card-radius); padding: 1.9rem 1.6rem;
        box-shadow: var(--shadow-card);
        transition: transform 0.25s ease, border-color 0.25s ease;
      }
      .card:hover { transform: translateY(-4px); border-color: var(--border-strong); }
      .card-featured { border-color: var(--accent-primary); box-shadow: var(--shadow-glow), var(--shadow-card); }
      .card-tag {
        position: absolute; top: -0.75rem; left: 1.6rem;
        background: var(--accent-gradient); color: #fff;
        font-size: 0.875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
        padding: 0.28rem 0.75rem; border-radius: 999px;
      }
      .card-tag-neutral { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
      .card-audience {
        font-size: 0.875rem; font-weight: 700; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--accent-primary);
      }
      .card-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
      .card-tagline { font-size: 0.92rem; color: var(--text-secondary); }
      .card-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.35rem; }
      .price-val { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
      .price-period { font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); }
      .price-note {
        font-size: 0.9rem; color: var(--text-muted);
        border-left: 2px solid var(--border-strong); padding-left: 0.7rem;
      }
      .price-strike { color: var(--text-muted); text-decoration: line-through; margin-right: 0.35rem; }
      .savings-highlight { color: var(--success-color); font-weight: 600; }
      .card-seats {
        display: inline-flex; align-items: center; gap: 0.4rem;
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: 8px; padding: 0.35rem 0.7rem;
        font-size: 0.9rem; font-weight: 650; color: var(--text-secondary);
        align-self: flex-start;
      }
      .card-features { list-style: none; display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.25rem; }
      .card-features li {
        display: flex; align-items: flex-start; gap: 0.55rem;
        font-size: 0.9rem; color: var(--text-secondary);
      }
      .card-features .icon { color: var(--success-color); margin-top: 0.35em; }
      .card-facts {
        display: flex; flex-direction: column; gap: 0.3rem;
        border-top: 1px solid var(--border-color); padding-top: 0.9rem; margin-top: auto;
        font-size: 0.875rem; color: var(--text-muted);
      }
      .card-fact { display: flex; justify-content: space-between; gap: 0.75rem; }
      .card-fact dt { color: var(--text-muted); }
      .card-fact dd { color: var(--text-secondary); font-weight: 600; text-align: right; }
      .promo-hint {
        display: flex; align-items: flex-start; gap: 0.5rem; width: 100%;
        background: var(--success-soft); border: 1px solid rgba(16, 185, 129, 0.4);
        border-radius: 10px; padding: 0.6rem 0.75rem;
        font-family: inherit; font-size: 0.9rem; line-height: 1.5;
        color: var(--success-text); text-align: left; cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .promo-hint:hover { border-color: var(--success-color); transform: translateY(-1px); }
      .promo-hint .icon { margin-top: 0.15em; }
      .card-cta { margin-top: 0.4rem; }

      /* --- Transparency table --- */
      .section { margin: 4rem 0; }
      .section-head { text-align: center; max-width: 640px; margin: 0 auto 2rem; }
      .section-title {
        display: inline-flex; align-items: center; gap: 0.55rem;
        font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem;
      }
      .section-title .icon { color: var(--accent-primary); }
      .section-sub { font-size: 0.95rem; color: var(--text-secondary); }
      .table-scroll {
        overflow-x: auto; border: 1px solid var(--border-color);
        border-radius: var(--card-radius); background: var(--bg-card);
      }
      .compare-table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 0.9rem; }
      .compare-table th, .compare-table td { padding: 0.85rem 1.1rem; text-align: left; vertical-align: top; }
      .compare-table thead th {
        font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--text-muted); border-bottom: 1px solid var(--border-color);
        background: var(--bg-surface);
      }
      .compare-table thead th:first-child { width: 22%; }
      .compare-table tbody tr + tr { border-top: 1px solid var(--border-color); }
      .compare-table tbody th {
        font-weight: 600; color: var(--text-primary); white-space: nowrap;
      }
      .compare-table td { color: var(--text-secondary); }
      .compare-table .col-featured { background: rgba(99, 102, 241, 0.06); }
      .cell-yes { color: var(--success-color); font-weight: 600; display: inline-flex; align-items: center; gap: 0.35rem; }
      .cell-no { color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.35rem; }

      /* --- Guarantees --- */
      .guarantees-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
      .guarantee-card {
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: 13px; padding: 1.3rem; display: flex; flex-direction: column; gap: 0.45rem;
      }
      .guarantee-icon {
        width: 2.4rem; height: 2.4rem; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(99, 102, 241, 0.14); color: var(--accent-primary);
      }
      .guarantee-title { font-size: 1rem; font-weight: 700; }
      .guarantee-desc { font-size: 0.95rem; color: var(--text-secondary); }

      /* --- Auth / forms --- */
      .auth-section {
        max-width: 540px; margin: 3rem auto; scroll-margin-top: 6rem;
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: var(--card-radius); padding: 2.4rem; box-shadow: var(--shadow-card);
      }
      .auth-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem; }
      .auth-subtitle { font-size: 0.92rem; color: var(--text-secondary); text-align: center; margin-bottom: 1.8rem; }
      .auth-form { display: flex; flex-direction: column; gap: 1.1rem; }
      .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
      .form-label { font-size: 0.95rem; font-weight: 650; color: var(--text-secondary); }
      .form-input {
        padding: 0.75rem 1rem; border-radius: 10px;
        border: 1px solid var(--border-color); background: var(--bg-primary);
